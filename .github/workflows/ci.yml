# CI branchée sur Rampe (https://github.com/RaoulBonsso/rampe).
# Généré par scripts/installer.sh : modifiable à la main.
name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # lundi : scan complet des secrets de l'historique
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    if: github.event_name != 'schedule'
    uses: RaoulBonsso/rampe/.github/workflows/node-qualite.yml@v1
    with:
      scripts: lint typecheck test build

  securite:
    uses: RaoulBonsso/rampe/.github/workflows/securite.yml@v1
